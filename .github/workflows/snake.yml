name: Contribution snake

on:
  schedule:
    - cron: "0 15 * * *" # every day at 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0D96F6&color_dots=#ebedf0,#d4c8ff,#a993ff,#8364ff,#5b34e0
            dist/snake-dark.svg?color_snake=#3FB0FF&color_dots=#161b22,#2e2466,#4b3aa8,#6e55e8,#9d85ff

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
