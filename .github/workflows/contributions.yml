name: Contribution card

on:
  schedule:
    - cron: "0 15 * * *" # every day at 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml
      - .github/scripts/contribution-card.mjs

permissions:
  contents: write

concurrency:
  group: contribution-card
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build contribution cards
        run: node .github/scripts/contribution-card.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Publish cards to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Update contribution card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
